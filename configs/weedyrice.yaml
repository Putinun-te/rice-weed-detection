# Config for rwd.prepare_weedyrice (WeedyRice-RGBMS-DB, CC BY 4.0, see DATASET.md).
# Paths are relative to this file's folder.
#
# Values confirmed against the real download on 2026-11-12 (734 RGB JPG 1280x960, 734 PNG masks 0/255):
# - image_metadata.csv has 5 rows per capture (1 RGB + 4 multispectral bands) -> row_filter keeps RGB rows.
# - files in RGB/ and Masks/ use the "standardized" names from filename_mapping.csv, not original_filename.
# - a mask has the same stem as its RGB image, extension .png.

source_dir: ../data/raw/weedyrice
out_dir: ../data/weedyrice_seg

rgb_dir: RGB
mask_dir: Masks
mask_name: "{stem}.png"          # confirmed: same stem as the RGB file

metadata:
  csv: Metadata/image_metadata.csv
  filename_column: original_filename
  group_column: acquisition_date
  group_format: date             # "date" -> YYYY-MM-DD, "raw" -> value as is
  keep_columns: [altitude]       # for results by altitude in Phase 4 (string like "20.018m")
  row_filter:                    # keep only the RGB rows (the CSV also lists the 4 MS bands)
    sensor_type: RGB
  filename_mapping:              # metadata names files by original_filename; disk uses standardized names
    csv: Metadata/filename_mapping.csv
    from_column: original_filename
    to_column: standardized_filename

# Split by capture date / site, never by random image.
# Draft: test = Longxuyen (other site and date), val = Thoaison September, train = Thoaison June.
# RGB images per date: 2024-06-02: 115, 2024-06-04: 331, 2024-09-30: 41, 2025-01-15: 247.
# Only 2025-01-15 (test) has 12 m flights (61 images); all other dates are 20 m.
split_by_group:
  train: ["2024-06-02", "2024-06-04"]
  val: ["2024-09-30"]
  test: ["2025-01-15"]
drop_unassigned_groups: false

class_name: weedy_rice
mask_threshold: 127              # mask pixel > threshold = weedy rice (dataset: 255 = weedy rice)
min_area_px: 20                  # drop tiny regions (annotation noise)
epsilon_px: 1.0                  # polygon simplification

resize_max_side: null            # images are delivered at 1280x960, no resize needed
tile:
  size: null                     # null = whole image (train with imgsz 1280); e.g. 640 to tile
  overlap: 0.2

jpeg_quality: 95
max_output_gb: 5                 # stop early to protect the 15 GB Studio Lab disk
near_dup_bits: 4                 # near-duplicate warning across splits (dHash distance)
