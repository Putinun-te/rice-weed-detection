# Same as train_s.yaml plus stronger scale and colour augmentation. Compare on val only.

model: yolo26s-seg.pt            # config value. "-seg" = masks. "yolo26n.pt" would train boxes only.
data: ../data/weedyrice_seg/data.yaml
project: ../runs                 # outside git
name: weedyrice_yolo26s-seg_1280_aug

imgsz: 1280                      # images are 1280x960; fall back to 960 or tiles (640) if memory runs out
epochs: 100
patience: 30                     # stop early if val does not improve for 30 epochs
batch: 2                         # yolo26s-seg at batch 3 filled all 8 GB in the smoke run; batch 2 leaves headroom
workers: 4
seed: 0
deterministic: true
amp: true
save_period: 5                   # checkpoint every 5 epochs, so a killed WSL session loses little
device: 0                        # GPU index, or "cpu"

# Extra Ultralytics train arguments (augmentation etc.). Top-down drone images: vertical flip is safe.
extra:
  flipud: 0.5
  fliplr: 0.5
  degrees: 0.0
  plots: true
  # Stronger than the Ultralytics defaults (scale 0.5, hsv_v 0.4), to cover flight heights and light
  # that the two training dates do not have. Compare with train_s.yaml on val only.
  scale: 0.7
  hsv_v: 0.5
  hsv_s: 0.8
